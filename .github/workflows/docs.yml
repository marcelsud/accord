name: Docs
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "website/**"
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
  pull-requests: write
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - working-directory: website
        run: npm ci
      - working-directory: website
        run: npm run docs:build
      - id: deploy
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/.vitepress/dist --project-name=accord-docs --branch=${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.deploy.outcome == 'success'
        run: |
          echo "deployment-url=${{ steps.deploy.outputs.deployment-url }}"
          echo "pages-deployment-alias-url=${{ steps.deploy.outputs.pages-deployment-alias-url }}"
